<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SERHII USHAKOV</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      margin: 0;
      background: #f6f7fb;
      color: #111;
    }

    header {
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      letter-spacing: 1px;
    }

    p {
      color: #666;
      margin-top: 10px;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      border: 1px solid #eee;
    }

    .emoji {
      font-size: 28px;
    }

    .title {
      font-size: 18px;
      margin-top: 10px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .links a {
      display: inline-block;
      margin-right: 10px;
      margin-top: 6px;
      font-size: 13px;
      text-decoration: none;
      color: #007aff;
    }

    .links a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>SERHII USHAKOV</h1>
    <p>Mobile applications for iOS & Android</p>
  </header>

  <div class="container">

    <div class="grid">

      <!-- CAT -->
      <div class="card">
        <div class="emoji">🐱</div>
        <div class="title">Cat Translator</div>
        <div class="subtitle">for Cats</div>

        <div class="links">
          <a href="https://apps.apple.com/app/id1624899198" target="_blank">App Store</a>
          <a href="https://play.google.com/store/apps/details?id=games.lenvik.tfc1" target="_blank">Google Play</a>
        </div>
      </div>

      <!-- DOG -->
      <div class="card">
        <div class="emoji">🐶</div>
        <div class="title">Dog Translator</div>
        <div class="subtitle">for Dogs</div>

        <div class="links">
          <a href="https://apps.apple.com/app/id1630558619" target="_blank">App Store</a>
          <a href="https://play.google.com/store/apps/details?id=games.lenvik.tfd2" target="_blank">Google Play</a>
        </div>
      </div>

      <!-- BIRD -->
      <div class="card">
        <div class="emoji">🐦</div>
        <div class="title">Bird & Parrot Translator</div>
        <div class="subtitle">for Birds</div>

        <div class="links">
          <a href="https://apps.apple.com/app/id6770038023" target="_blank">App Store</a>
          <a href="https://play.google.com/store/apps/details?id=games.lenvik.tfb3" target="_blank">Google Play</a>
        </div>
      </div>

    </div>
  </div>

  <footer>
    © 2026 SERHII USHAKOV. All rights reserved.
  </footer>

</body>
</html>
