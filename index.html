<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SERHII USHAKOV</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      margin: 0;
      background: #f6f7fb;
      color: #111;
    }

    header {
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      letter-spacing: 1px;
    }

    p {
      color: #666;
      margin-top: 10px;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #111;
      transition: 0.2s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      border: 1px solid #eee;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
    }

    .emoji {
      font-size: 28px;
    }

    .title {
      font-size: 18px;
      margin-top: 10px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 13px;
    }

    a {
      color: inherit;
    }
  </style>
</head>

<body>

  <header>
    <h1>SERHII USHAKOV</h1>
    <p>Mobile applications for iOS & Android</p>
  </header>

  <div class="container">

    <div class="grid">

      <a class="card" href="https://apps.apple.com/app/id1624899198">
        <div class="emoji">🐱</div>
        <div class="title">Cat Translator</div>
        <div class="subtitle">for Cats</div>
      </a>

      <a class="card" href="https://apps.apple.com/app/id1630558619">
        <div class="emoji">🐶</div>
        <div class="title">Dog Translator</div>
        <div class="subtitle">for Dogs</div>
      </a>

      <a class="card" href="https://apps.apple.com/app/id6770038023">
        <div class="emoji">🐦</div>
        <div class="title">Bird & Parrot Translator</div>
        <div class="subtitle">for Birds</div>
      </a>

    </div>
  </div>

  <footer>
    © 2026 SERHII USHAKOV. All rights reserved.
  </footer>

</body>
</html>
